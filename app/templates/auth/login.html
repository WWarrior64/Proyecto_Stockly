<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockly - Inicio de sesión</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen w-full relative bg-gray-900 flex flex-col">

  <!-- Fondo con gradiente y efecto -->
  <div class="absolute inset-0 z-0">
    <img src="{{ url_for('static', filename='images/fondo_stockly.png') }}"
         alt="Fondo almacén"
         class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-br from-black/50 via-black/40 to-brandTeal/30"></div>
  </div>

  <!-- Contenedor principal -->
  <div class="relative z-10 flex-1 flex items-center justify-center w-full px-4 py-6 md:py-8 overflow-y-auto">
    <div class="w-full max-w-6xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 items-center">

        <!-- Sección izquierda: Logo y descripción -->
        <div class="hidden md:flex flex-col items-center justify-center space-y-6 text-white">
          <div class="transform hover:scale-105 transition-transform duration-300">
            <img src="{{ url_for('static', filename='images/Logo_stockly-remove.png') }}"
                 alt="Logo Stockly"
                 class="w-40 md:w-48 h-auto drop-shadow-2xl">
          </div>
          <div class="space-y-4 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-brandOrange">Stockly</h1>
            <p class="text-base md:text-lg text-gray-200 max-w-md">Gestión eficiente de inventario y pedidos para tu negocio</p>
            <div class="flex flex-col md:flex-row justify-center gap-3 md:gap-4 text-brandOrange text-opacity-80 text-xs md:text-sm">
              <div class="flex items-center gap-2">
                <i class="fas fa-check-circle"></i>
                <span>Rápido y confiable</span>
              </div>
              <div class="flex items-center gap-2">
                <i class="fas fa-shield-alt"></i>
                <span>Seguro</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Sección derecha: Formulario -->
        <div class="w-full flex justify-center">
          <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-6 md:p-10 w-full max-w-md">
            
            <!-- Título -->
            <div class="text-center mb-8">
              <h2 class="text-3xl font-bold text-gray-900 mb-2">Bienvenido</h2>
              <p class="text-gray-600">Inicia sesión en tu cuenta</p>
            </div>

            <!-- Mensajes flash -->
            {% include 'partials/_flash.html' %}

            <!-- Formulario -->
            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
              
              <!-- Correo Electrónico -->
              <div class="relative group">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Correo Electrónico</label>
                <div class="relative">
                  <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-brandOrange/60"></i>
                  <input 
                    type="email"
                    name="email" 
                    required
                    placeholder="tu@email.com" 
                    class="w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-brandOrange focus:ring-2 focus:ring-brandOrange/20 transition-all duration-300"
                  >
                </div>
              </div>

              <!-- Contraseña -->
              <div class="relative group">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
                <div class="relative">
                  <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-brandOrange/60"></i>
                  <input 
                    type="password" 
                    name="contrasena" 
                    required
                    placeholder="••••••••" 
                    class="w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-brandOrange focus:ring-2 focus:ring-brandOrange/20 transition-all duration-300"
                  >
                </div>
              </div>

              <!-- Enlace de registro -->
              <div class="flex items-center justify-between pt-2">
                <a href="{{ url_for('auth.register') }}" 
                   class="text-sm text-brandOrange font-semibold hover:text-orange-600 transition-colors duration-200">
                   ¿Eres empleado nuevo? Regístrate
                </a>
              </div>

              <!-- Botón de envío -->
              <button 
                type="submit"
                class="w-full bg-gradient-to-r from-brandOrange to-orange-600 text-white py-3 rounded-lg font-bold text-lg hover:shadow-lg hover:scale-[1.02] transition-all duration-300 mt-6 flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i>
                Iniciar Sesión
              </button>
            </form>

            <!-- Divider -->
            <div class="relative flex items-center my-8">
              <div class="flex-grow border-t-2 border-gray-200"></div>
              <span class="px-4 text-gray-500 text-sm font-medium">O conecta con</span>
              <div class="flex-grow border-t-2 border-gray-200"></div>
            </div>

            <!-- Redes Sociales -->
            <div class="flex justify-center gap-4">
              <a href="#" class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-600 to-blue-700 text-white flex items-center justify-center hover:shadow-lg hover:scale-110 transition-all duration-300" title="Facebook">
                <i class="fab fa-facebook text-lg"></i>
              </a>
              <a href="#" class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-500 to-rose-600 text-white flex items-center justify-center hover:shadow-lg hover:scale-110 transition-all duration-300" title="Instagram">
                <i class="fab fa-instagram text-lg"></i>
              </a>
              <a href="#" class="w-12 h-12 rounded-full bg-gradient-to-br from-sky-500 to-blue-600 text-white flex items-center justify-center hover:shadow-lg hover:scale-110 transition-all duration-300" title="Twitter">
                <i class="fab fa-twitter text-lg"></i>
              </a>
            </div>

            <!-- Footer -->
            <p class="text-center text-gray-600 text-sm mt-8">
              Al iniciar sesión, aceptas nuestros términos de servicio
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/flash.js') }}" defer></script>
</body>
</html>
