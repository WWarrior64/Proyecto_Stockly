<!-- templates/pedidos/crear_editar_pedido.html (PARCIAL) -->
<div id="pedidoPartial"
     data-modal-type="crear_editar_pedido"
     data-pedido-id="{{ pedido_id or request.args.get('id','') }}"
     class="p-4 space-y-6">

  <!-- ENCABEZADO -->
  <header class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-brandOrange">
      {{ 'Editar Pedido' if pedido_id else 'Crear Pedido' }}
    </h2>
    <button type="button"
            class="text-sm text-gray-600 hover:text-brandOrange close-modal-small"
            aria-label="Cerrar">
      ×
    </button>
  </header>

  <!-- FORMULARIO -->
  <form id="pedidoForm" class="space-y-6">
    <!-- DATOS GENERALES -->
    <section>
      <h3 class="text-lg font-medium text-gray-800 mb-4">Datos del Pedido</h3>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Código -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Código <span class="text-red-500">*</span>
          </label>
          <input id="pedido_codigo"
                 name="codigo"
                 type="text"
                 class="w-full border rounded-md px-3 py-2"
                 placeholder="Autogenerado o único">
        </div>

        <!-- Fecha -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
          <input id="pedido_fecha"
                 name="fecha"
                 type="text"
                 readonly
                 value="{{ fecha_actual or '' }}"
                 class="w-full border rounded-md px-3 py-2 bg-gray-100 text-gray-700">
        </div>

        <!-- Estado -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
          <select id="pedido_estado"
                  name="estado"
                  class="w-full border rounded-md px-3 py-2">
            <option value="pendiente">Pendiente</option>
            <option value="entregado">Entregado</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <!-- Proveedor -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Proveedor <span class="text-red-500">*</span>
          </label>
          <select id="pedido_proveedor"
                  name="proveedor_id"
                  class="w-full border rounded-md px-3 py-2"
                  required>
            <option value="">Seleccione proveedor</option>
          </select>
        </div>

        <!-- Tipo de pago -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Tipo de pago <span class="text-red-500">*</span>
          </label>
          <select id="pedido_tipo_pago"
                  name="tipo_pago_id"
                  class="w-full border rounded-md px-3 py-2"
                  required>
            <option value="">Seleccione tipo</option>
          </select>
        </div>

        <!-- Botón Registrar Recepción -->
        <div class="flex items-end justify-end">
          <button type="button"
                  id="pedido_registrar_recepcion"
                  class="px-4 py-2 bg-brandOrange text-white rounded-full shadow hover:brightness-95"
                  style="display:none;">
            Registrar Recepción
          </button>
        </div>
      </div>
    </section>

    <!-- DETALLES -->
    <section class="border-t pt-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-medium text-gray-800">Detalles del Pedido</h3>
        <button type="button"
                id="pedido_agregar_detalle"
                class="px-4 py-2 bg-brandOrange text-white rounded-full hover:brightness-95">
          + Agregar Producto
        </button>
      </div>

      <div class="overflow-auto border rounded-lg">
        <table class="w-full table-auto text-sm">
          <thead class="bg-gray-100 text-gray-700">
            <tr>
              <th class="px-3 py-2 text-left">Producto</th>
              <th class="px-3 py-2 text-center">Cantidad</th>
              <th class="px-3 py-2 text-center">Precio Unitario</th>
              <th class="px-3 py-2 text-center">Subtotal</th>
              <th class="px-3 py-2 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="pedido_detalles_tbody">
            <tr class="no-items-row">
              <td colspan="5" class="text-center py-4 text-gray-500">Sin productos agregados.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Fila plantilla (oculta) - clonar desde JS -->
      <template id="pedido_detalle_template">
        <tr class="detalle-row border-t">
          <td class="px-3 py-2">
            <select name="producto_id[]" class="w-full border rounded-md px-2 py-1 detalle-producto">
              <option value="">Seleccione producto</option>
            </select>
          </td>
          <td class="px-3 py-2 text-center">
            <input name="cantidad[]" type="number" min="1" value="1" class="w-20 border rounded-md px-2 py-1 text-center detalle-cantidad">
          </td>
          <td class="px-3 py-2 text-center">
            <input name="precio_unitario[]" type="number" min="0" step="0.01" value="0.00" readonly class="w-24 border rounded-md px-2 py-1 text-center bg-gray-50 detalle-precio">
          </td>
          <td class="px-3 py-2 text-center text-gray-800 font-medium detalle-subtotal">0.00</td>
          <td class="px-3 py-2 text-center">
            <button type="button" class="text-red-500 hover:text-red-700 detalle-eliminar">🗑</button>
          </td>
        </tr>
      </template>

      <!-- Total -->
      <div class="flex justify-end mt-4">
        <p id="pedido_total" class="text-lg font-semibold text-gray-800">Total: $0.00</p>
      </div>
    </section>

    <!-- BOTONES -->
    <div class="flex justify-end gap-3 pt-2 border-t">
      <button type="button"
              class="close-modal-small px-4 py-2 bg-gray-200 rounded-full hover:bg-gray-300">
        Cancelar
      </button>
      <button id="pedido_save"
              type="submit"
              class="px-5 py-2 bg-brandOrange text-white rounded-full shadow hover:brightness-95">
        Guardar Pedido
      </button>
    </div>

    <!-- MENSAJES -->
    <div id="pedido_error" class="mt-2 text-sm text-red-600 hidden"></div>
    <div id="pedido_success" class="mt-2 text-sm text-green-600 hidden"></div>
  </form>
</div>
