<!-- partial: registrar_movimiento.html -->
<div data-modal-type="registrar_movimiento" data-product-id="{{ request.args.get('id','') }}">
  <div class="p-4 max-w-3xl">

    <header class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold text-brandOrange">Registrar Movimiento de Inventario</h2>
      <button id="mov_close_small" class="text-gray-600 hover:text-brandOrange" aria-label="Cerrar">×</button>
    </header>

    <form id="movimientoForm" class="space-y-4">

      <!-- Tipo movimiento + Usuario -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="mov_tipo" class="block text-sm font-medium text-gray-700 mb-1">
            Tipo de movimiento <span class="text-red-500">*</span>
          </label>
          <select id="mov_tipo" required class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brandOrange">
            <option value="" disabled selected>Seleccione tipo</option>
            <option value="recepcion_de_pedido">Recepción de pedido</option>
            <option value="salida">Salida</option>
            <option value="ajuste">Ajuste</option>
            <option value="entrada">Entrada</option>
            <option value="actualizacion_de_stock">Actualización de stock</option>
          </select>
        </div>

        <div>
          <label for="mov_usuario" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
          <input id="mov_usuario" type="text" readonly class="w-full border rounded-md px-3 py-2 bg-gray-100 text-gray-700" />
        </div>
      </div>

      <!-- SECCIÓN: tipo != recepcion_de_pedido -->
      <div id="mov_seccion_general" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
          <label for="mov_producto" class="block text-sm font-medium text-gray-700 mb-1">
            Producto <span class="text-red-500">*</span>
          </label>
          <select id="mov_producto" required class="w-full border rounded-md px-3 py-2">
            <option value="">Seleccione producto</option>
          </select>
        </div>

        <div>
          <label for="mov_lote" class="block text-sm font-medium text-gray-700 mb-1">Lote (opcional)</label>
          <select id="mov_lote" class="w-full border rounded-md px-3 py-2">
            <option value="">No asignar lote</option>
          </select>
        </div>

        <div>
          <label for="mov_cantidad" class="block text-sm font-medium text-gray-700 mb-1">
            Cantidad <span class="text-red-500">*</span>
          </label>
          <input id="mov_cantidad" type="number" step="1" class="w-full border rounded-md px-3 py-2 text-center" />
          <p class="text-xs text-gray-500 mt-1">Usar valor negativo para salidas si aplica.</p>
        </div>
      </div>

      <!-- SECCIÓN: tipo == recepcion_de_pedido (inicialmente oculta) -->
      <div id="mov_seccion_pedido" class="hidden border-t pt-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="mov_pedido" class="block text-sm font-medium text-gray-700 mb-1">
              Pedido (pendientes) <span class="text-red-500">*</span>
            </label>
            <select id="mov_pedido" class="w-full border rounded-md px-3 py-2">
              <option value="">Seleccione pedido</option>
            </select>
          </div>

          <div>
            <label for="mov_detalle" class="block text-sm font-medium text-gray-700 mb-1">
              Detalle de Pedido (ítem) <span class="text-red-500">*</span>
            </label>
            <select id="mov_detalle" class="w-full border rounded-md px-3 py-2">
              <option value="">Seleccione ítem del pedido</option>
            </select>
          </div>
        </div>

        <!-- Detalles del ítem -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 items-end">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Producto</label>
            <input id="mov_detalle_producto" type="text" readonly class="w-full border rounded-md px-3 py-2 bg-gray-100">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Solicitado</label>
            <input id="mov_detalle_solicitado" type="number" readonly class="w-full border rounded-md px-3 py-2 bg-gray-100 text-center">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Cantidad recibida <span class="text-red-500">*</span>
            </label>
            <input id="mov_cantidad_recibida" type="number" min="0" class="w-full border rounded-md px-3 py-2 text-center">
            <p class="text-xs text-gray-500 mt-1">Máx: cantidad solicitada.</p>
          </div>
        </div>

        <!-- Lote y fechas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
          <div>
            <label for="mov_lote_codigo" class="block text-sm font-medium text-gray-700 mb-1">Código de lote (opcional)</label>
            <input id="mov_lote_codigo" type="text" placeholder="Dejar vacío para autogenerar" class="w-full border rounded-md px-3 py-2">
          </div>

          <div>
            <label for="mov_fecha_fabricacion" class="block text-sm font-medium text-gray-700 mb-1">Fecha fabricación <span class="text-red-500">*</span></label>
            <input id="mov_fecha_fabricacion" type="date" class="w-full border rounded-md px-3 py-2">
          </div>

          <div>
            <label for="mov_fecha_vencimiento" class="block text-sm font-medium text-gray-700 mb-1">Fecha vencimiento <span class="text-red-500">*</span></label>
            <input id="mov_fecha_vencimiento" type="date" class="w-full border rounded-md px-3 py-2">
          </div>
        </div>

        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Nota (discrepancias, observaciones)</label>
          <textarea id="mov_nota_pedido" rows="3" class="w-full border rounded-md px-3 py-2"></textarea>
        </div>

        <div class="mt-3 text-sm text-gray-600">
          <p>Soporta recepciones parciales. Después de guardar, puedes usar "Agregar otro ítem" para procesar más ítems del mismo pedido.</p>
        </div>
      </div>

      <!-- BOTONES -->
      <div class="flex justify-end gap-3 pt-2 border-t">
        <button type="button" id="mov_cancel" class="px-4 py-2 bg-gray-200 rounded-full hover:bg-gray-300">Cancelar</button>

        <button type="button" id="mov_agregar_otro" class="px-4 py-2 bg-white border rounded-full hover:bg-gray-50">Agregar otro ítem</button>

        <button type="submit" id="mov_guardar" class="px-5 py-2 bg-brandOrange text-white rounded-full shadow">Guardar</button>
      </div>

      <!-- Mensajes -->
      <div id="mov_msg_error" class="mt-2 text-sm text-red-600 hidden"></div>
      <div id="mov_msg_success" class="mt-2 text-sm text-green-600 hidden"></div>
    </form>

  </div>
</div>
