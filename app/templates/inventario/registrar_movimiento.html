<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Stockly - Registrar Movimiento</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div id="app" class="text-gray-900">

  <!-- Selector de tipo de movimiento -->
  <div class="bg-white p-6 rounded-xl shadow-lg w-96 text-center">
    <h1 class="text-xl font-semibold text-brandOrange mb-4">Registrar Movimiento</h1>

    <label class="block text-sm font-medium text-gray-700 mb-2">Seleccione tipo de movimiento</label>
    <select v-model="tipo_movimiento"
            @change="abrirModal"
            class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
      <option value="">Seleccione...</option>
      <option value="entrada">Entrada</option>
      <option value="salida">Salida</option>
      <option value="ajuste">Ajuste</option>
      <option value="recepcion_de_pedido">Recepción de pedido</option>
    </select>
  </div>

  <!-- MODAL flotante -->
  <div v-if="mostrarModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl p-6 relative animate-fadeIn">

      <!-- Botón cerrar -->
      <button @click="cerrarModal"
              class="absolute top-3 right-3 text-gray-500 hover:text-red-600 text-2xl">&times;</button>

      <!-- Contenido dinámico según tipo -->
      <h2 class="text-xl font-semibold text-orange-500 mb-4 capitalize">
        {{ tipo_movimiento.replace('_', ' ') }}
      </h2>

      <!-- Entrada -->
      <div v-if="tipo_movimiento === 'entrada'">
        <label class="block text-sm font-medium text-gray-700 mb-1">Producto</label>
        <input type="text" v-model="formData.producto" class="w-full border rounded-md px-3 py-2 mb-3">

        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
        <input type="number" v-model="formData.cantidad" class="w-full border rounded-md px-3 py-2 mb-3">

        <label class="block text-sm font-medium text-gray-700 mb-1">Nota</label>
        <textarea v-model="formData.nota" class="w-full border rounded-md px-3 py-2 mb-4"></textarea>
      </div>

      <!-- Salida -->
      <div v-if="tipo_movimiento === 'salida'">
        <label class="block text-sm font-medium text-gray-700 mb-1">Producto</label>
        <input type="text" v-model="formData.producto" class="w-full border rounded-md px-3 py-2 mb-3">

        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad (negativo si aplica)</label>
        <input type="number" v-model="formData.cantidad" class="w-full border rounded-md px-3 py-2 mb-3">
      </div>

      <!-- Ajuste -->
      <div v-if="tipo_movimiento === 'ajuste'">
        <label class="block text-sm font-medium text-gray-700 mb-1">Motivo del ajuste</label>
        <textarea v-model="formData.nota" rows="3" class="w-full border rounded-md px-3 py-2 mb-4"></textarea>

        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad ajustada</label>
        <input type="number" v-model="formData.cantidad" class="w-full border rounded-md px-3 py-2">
      </div>

      <!-- Recepción de pedido -->
      <div v-if="tipo_movimiento === 'recepcion_de_pedido'">
        <label class="block text-sm font-medium text-gray-700 mb-1">Seleccionar Pedido</label>
        <select v-model="formData.pedido" class="w-full border rounded-md px-3 py-2 mb-3">
          <option value="">Seleccione...</option>
          <option value="pedido_1">Pedido #1</option>
          <option value="pedido_2">Pedido #2</option>
        </select>

        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad Recibida</label>
        <input type="number" v-model="formData.cantidad" class="w-full border rounded-md px-3 py-2 mb-3">
      </div>

      <!-- Botones -->
      <div class="flex justify-end mt-6 gap-3">
        <button @click="cerrarModal" class="px-4 py-2 bg-gray-200 rounded-full hover:bg-gray-300">Cancelar</button>
        <button @click="guardarMovimiento" class="px-5 py-2 bg-orange-500 text-white rounded-full hover:bg-orange-600">Guardar</button>
      </div>

    </div>
  </div>
</div>

<!-- Animación -->
<style>
@keyframes fadeIn { from {opacity:0; transform:scale(0.95);} to {opacity:1; transform:scale(1);} }
.animate-fadeIn { animation: fadeIn 0.2s ease-in-out; }
</style>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      tipo_movimiento: "",
      mostrarModal: false,
      formData: {
        producto: "",
        cantidad: "",
        nota: "",
        pedido: ""
      }
    }
  },
  methods: {
    abrirModal() {
      if (this.tipo_movimiento) this.mostrarModal = true;
    },
    cerrarModal() {
      this.mostrarModal = false;
      this.formData = { producto: "", cantidad: "", nota: "", pedido: "" };
    },
    guardarMovimiento() {
      console.log("Guardando:", this.tipo_movimiento, this.formData);
      alert(`Movimiento ${this.tipo_movimiento} registrado correctamente.`);
      this.cerrarModal();
    }
  }
}).mount("#app");
</script>

</body>
</html>
