<!-- partial: ce_productos.html -->
<div data-modal-type="ce_productos" data-product-id="{{ request.args.get('id','') }}">
  <div class="p-6 max-w-2xl">

    <form id="productForm" class="space-y-5">
      <input type="hidden" id="prod_id" value="{{ request.args.get('id','') }}">

      <!-- SKU -->
      <div>
        <label for="prod_sku" class="block text-sm font-semibold text-gray-800 mb-2">
          SKU <span class="text-xs text-gray-500">(Se autogenera si se deja vacío)</span>
        </label>
        <input id="prod_sku" name="sku" placeholder="Dejar vacío para autogenerar" 
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all">
      </div>

      <!-- Nombre -->
      <div>
        <label for="prod_nombre" class="block text-sm font-semibold text-gray-800 mb-2">
          Nombre del producto <span class="text-red-500">*</span>
        </label>
        <input id="prod_nombre" name="nombre" required 
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all">
      </div>

      <!-- Precio y Estado -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="prod_precio" class="block text-sm font-semibold text-gray-800 mb-2">
            Precio unitario
          </label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">$</span>
            <input id="prod_precio" name="precio" type="number" step="0.01" min="0" 
                   class="w-full border border-gray-300 rounded-lg pl-8 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all">
          </div>
        </div>

        <div>
          <label for="prod_estado" class="block text-sm font-semibold text-gray-800 mb-2">
            Estado
          </label>
          <select id="prod_estado" name="estado" 
                  class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all appearance-none bg-white">
            <option value="">Seleccione</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
      </div>

      <!-- Categoría -->
      <div>
        <label for="prod_categoria" class="block text-sm font-semibold text-gray-800 mb-2">
          Categoría
        </label>
        <select id="prod_categoria" name="categoria" 
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all appearance-none bg-white">
          <option value="">Cargando categorías...</option>
        </select>
      </div>

      <!-- Descripción -->
      <div>
        <label for="prod_descripcion" class="block text-sm font-semibold text-gray-800 mb-2">
          Descripción
        </label>
        <textarea id="prod_descripcion" name="descripcion" rows="3" 
                  class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all resize-none"></textarea>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
        <button type="button" id="prod_cancel" 
                class="px-6 py-2.5 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200 transition-colors">
          Cancelar
        </button>
        <button type="submit" id="prod_save" 
                class="px-6 py-2.5 bg-brandOrange text-white rounded-lg font-medium hover:bg-orange-600 transition-colors shadow-md hover:shadow-lg">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
