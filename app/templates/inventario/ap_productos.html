<!-- partial: ap_productos.html -->
<div data-modal-type="ap_productos" data-product-id="{{ request.args.get('id','') }}">
  <div class="p-6">
    <!-- Header -->
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Asignar Proveedores</h2>
      <div class="bg-brandTeal/10 rounded-lg p-3 border border-brandTeal/20">
        <label class="text-xs font-medium text-gray-600 uppercase tracking-wide">Producto</label>
        <div id="ap_producto_nombre" class="mt-1 text-lg font-semibold text-gray-900">Cargando...</div>
      </div>
    </div>

    <!-- Formulario -->
    <form id="assignProveedorForm" class="mb-6 bg-gray-50 rounded-lg p-5 border border-gray-200">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
        <!-- Producto (readonly) -->
        <div class="lg:col-span-2">
          <label for="ap_producto" class="block text-sm font-semibold text-gray-800 mb-2">
            Producto
          </label>
          <input type="text" id="ap_producto" readonly 
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 bg-gray-100 text-gray-600 cursor-not-allowed">
        </div>

        <!-- Proveedor -->
        <div>
          <label for="ap_proveedor" class="block text-sm font-semibold text-gray-800 mb-2">
            Proveedor <span class="text-red-500">*</span>
          </label>
          <select id="ap_proveedor" required 
                  class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all appearance-none bg-white">
            <option value="">Cargando proveedores...</option>
          </select>
        </div>

        <!-- Precio -->
        <div>
          <label for="ap_precio" class="block text-sm font-semibold text-gray-800 mb-2">
            Precio de compra
          </label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">$</span>
            <input type="number" step="0.01" min="0" id="ap_precio" placeholder="0.00"
                   class="w-full border border-gray-300 rounded-lg pl-8 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all">
          </div>
        </div>

        <!-- Plazo -->
        <div>
          <label for="ap_plazo" class="block text-sm font-semibold text-gray-800 mb-2">
            Plazo de entrega
          </label>
          <div class="relative">
            <input type="number" min="1" id="ap_plazo" placeholder="1"
                   class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all">
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm">días</span>
          </div>
        </div>

        <!-- Pedido mínimo -->
        <div>
          <label for="ap_pedido_minimo" class="block text-sm font-semibold text-gray-800 mb-2">
            Pedido mínimo
          </label>
          <input type="number" min="1" id="ap_pedido_minimo" value="1" placeholder="1"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandOrange focus:border-transparent transition-all">
        </div>
      </div>

      <!-- Preferido y botón -->
      <div class="flex items-center justify-between pt-4 border-t border-gray-200">
        <label class="flex items-center cursor-pointer">
          <input id="ap_preferido" type="checkbox" class="w-5 h-5 text-brandOrange rounded focus:ring-2 focus:ring-brandOrange focus:ring-offset-2">
          <span class="ml-3 text-sm font-medium text-gray-800">Marcar como proveedor preferido</span>
        </label>
        <button type="submit" 
                class="px-6 py-2.5 bg-brandOrange text-white rounded-lg font-medium hover:bg-orange-600 transition-colors shadow-md hover:shadow-lg">
          Agregar
        </button>
      </div>
    </form>

    <!-- Tabla de asignaciones -->
    <div class="mb-6">
      <h3 class="text-lg font-bold text-gray-900 mb-3">Proveedores asignados</h3>
      <div class="overflow-auto max-h-64 border border-gray-200 rounded-lg">
        <table id="ap_asignaciones_table" class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-100 sticky top-0">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">Proveedor</th>
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">Precio</th>
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">Plazo</th>
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">Preferido</th>
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">Ped. Mínimo</th>
              <th class="px-4 py-3 text-right text-xs font-bold text-gray-700 uppercase tracking-wider">Acciones</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <!-- Filas cargadas por JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Botón cerrar -->
    <div class="flex justify-end pt-4 border-t border-gray-200">
      <button id="ap_close_btn" 
              class="px-6 py-2.5 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200 transition-colors">
        Cerrar
      </button>
    </div>
  </div>
</div>
