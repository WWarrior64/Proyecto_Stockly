<!-- partial: ap_productos.html -->
<!-- Se asume que la URL que trae este partial puede incluir ?id=PRODUCT_ID -->
<div data-modal-type="ap_productos" data-product-id="{{ request.args.get('id','') }}">
  <div class="p-4">
    <h2 class="text-2xl font-semibold mb-4">Asignar Proveedores a Producto</h2>
    <!-- Datos producto (será rellenado por JS si viene productId) -->
    <div class="mb-4">
      <label class="text-sm text-gray-600">Producto</label>
      <div id="ap_producto_nombre" class="mt-1 text-gray-800 font-medium">Cargando...</div>
    </div>
    <!-- Form nuevo -->
    <form id="assignProveedorForm" class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end mb-6">
      <div class="md:col-span-2">
        <label for="ap_producto" class="block text-sm font-medium text-gray-700">Producto:</label>
        <input type="text" id="ap_producto" readonly class="mt-1 block w-full border rounded p-2 bg-gray-100 cursor-not-allowed">
      </div>
      <div>
        <label for="ap_proveedor" class="block text-sm font-medium text-gray-700">Proveedor: <span class="text-red-600">*</span></label>
        <select id="ap_proveedor" required class="mt-1 block w-full border rounded p-2 select-with-arrow">
          <option value="">Cargando proveedores...</option>
        </select>
      </div>
      <div>
        <label for="ap_precio" class="block text-sm font-medium text-gray-700">Precio compra:</label>
        <input type="number" step="0.01" min="0" id="ap_precio" placeholder="0.00" class="mt-1 block w-full border rounded p-2">
      </div>
      <div>
        <label for="ap_plazo" class="block text-sm font-medium text-gray-700">Plazo entrega (días):</label>
        <input type="number" min="1" id="ap_plazo" placeholder="1" class="mt-1 block w-full border rounded p-2">
      </div>
      <div>
        <label for="ap_pedido_minimo" class="block text-sm font-medium text-gray-700">Pedido mínimo:</label>
        <input type="number" min="1" id="ap_pedido_minimo" value="1" placeholder="1" class="mt-1 block w-full border rounded p-2">
      </div>
      <div class="flex items-center space-x-4 col-span-full md:col-span-2">
        <div class="flex items-center h-10">
          <input id="ap_preferido" type="checkbox" class="w-4 h-4 text-orange-600 rounded">
          <label for="ap_preferido" class="ml-2 text-sm font-medium text-gray-700">Preferido</label>
        </div>
        <button type="submit" class="ml-auto px-4 py-2 rounded bg-brandOrange text-white">Agregar</button>
      </div>
    </form>
    <!-- Tabla asignaciones existentes -->
    <div class="mb-4">
      <h3 class="text-lg font-semibold mb-3">Asignaciones existentes</h3>
      <div class="overflow-auto max-h-48">
        <table id="ap_asignaciones_table" class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50 sticky top-0">
            <tr>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Proveedor</th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Precio</th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Plazo</th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Preferido</th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Pedido Mínimo</th>
              <th class="px-3 py-2 text-right text-xs font-medium text-gray-500">Acciones</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <!-- filas cargadas por JS -->
          </tbody>
        </table>
      </div>
    </div>
    <div class="flex justify-end">
      <button id="ap_close_btn" class="px-4 py-2 rounded bg-gray-200">Cerrar</button>
    </div>
  </div>
</div>
