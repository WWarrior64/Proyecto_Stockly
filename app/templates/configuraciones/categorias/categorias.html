<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Categorías - Stockly</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script type="module" src="{{ url_for('static', filename='js/views/categorias.js') }}" defer></script>
  <script type="module" src="{{ url_for('static', filename='js/views/config.js') }}" defer></script>

  <style>
    .modal-enter-active, .modal-leave-active { transition: all 180ms ease; }
    .modal-enter-from, .modal-leave-to { opacity: 0; transform: translateY(8px) scale(.99); }
    .modal-enter-to, .modal-leave-from { opacity: 1; transform: translateY(0) scale(1); }

    /* ocultar antes de que Vue monte (v-cloak global) */
    [v-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-brandTeal min-h-screen flex justify-center p-4 text-black">
  <div class="w-full max-w-6xl bg-brandTeal rounded-lg p-4">
    <!-- header (igual que tu original) -->
    <header class="items-center mb-4 relative">
      <div class="flex items-center justify-between">
        <a href="{{ url_for('main.home') }}" class="flex items-center gap-3">
          <img src="{{ url_for('static', filename='images/Logo_Stockly.png') }}" alt="Logo" class="w-16 h-16 object-contain">
        </a>
        <nav class="flex-1 flex justify-center">
          <ul class="inline-flex bg-white/90 text-black rounded-full px-6 py-2 gap-8 items-center shadow">
            <li><a href="{{ url_for('main.home') }}" class="text-black hover:text-brandOrange">Inicio</a></li>
            <li><a href="{{ url_for('inventario.inventario') }}" class="text-black hover:text-brandOrange">Inventario</a></li>
            <li><a href="{{ url_for('pedidos.pedidos') }}" class="text-black hover:text-brandOrange">Pedidos</a></li>
            <li><a href="{{ url_for('reportes.reportes') }}" class="text-black hover:text-brandOrange">Reportes</a></li>
            <li><a href="{{ url_for('cuenta.cuenta') }}" class="font-semibold text-brandOrange">Cuenta</a></li>
          </ul>
        </nav>
                  <!-- botón ajustes: pegado dentro del header principal, en la esquina derecha -->
      <div id="settings-root" class="relative">
        <button id="btn-settings"
                @click="toggleSettings"
                :aria-expanded="showSettings"
                aria-controls="settings-menu"
                class="flex items-center justify-center w-10 h-10 rounded-full bg-white/90 text-gray-800 shadow hover:scale-105 transition-transform duration-200"
                title="Ajustes">
          <!-- icono (engranaje) simplificado para mejor apariencia -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>

        <!-- menu desplegable -->
        <div v-cloak v-show="showSettings" id="settings-menu" role="menu" :aria-hidden="!showSettings"
            class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg ring-1 ring-black/5 overflow-hidden z-50 text-gray-900">
          <ul class="divide-y divide-gray-100">
            <li>
              <a href="{{ url_for('configuraciones.proveedores') }}" @click="showSettings = false" class="block w-full text-left px-4 py-3 hover:bg-gray-50 transition-colors">
                Gestionar proveedores
              </a>
            </li>
            <li>
              <a href="{{ url_for('configuraciones.categorias') }}" @click="showSettings = false" class="block w-full text-left px-4 py-3 hover:bg-gray-50 transition-colors">
                Gestionar categorías
              </a>
            </li>
          </ul>
        </div>
      </div>
      </div>
    </header>

    <!-- ROOT de Vue con v-cloak -->
    <main id="vm-categorias" v-cloak class="bg-white/95 rounded-2xl p-6 shadow-lg">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold text-brandOrange">Categorías</h1>
        <button @click="openCategoryModal(null)" class="bg-brandOrange text-white px-4 py-2 rounded-full">+ Crear categoría</button>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="p-3 text-left text-sm font-medium text-gray-700">Nombre</th>
              <th class="p-3 text-left text-sm font-medium text-gray-700">Descripción</th>
              <th class="p-3 text-left text-sm font-medium text-gray-700">Acciones</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y">
            <tr v-for="cat in categories" :key="cat.id" class="hover:bg-gray-50">
              <td class="p-3">[[ cat.nombre ]]</td>
              <td class="p-3">[[ cat.descripcion ]]</td>
              <td class="p-3">
                <div class="flex gap-2">
                  <button @click="openCategoryModal(cat)" class="px-2 py-1 rounded bg-white/80 border text-indigo-600">Editar</button>
                  <button @click="removeCategory(cat.id)" class="px-2 py-1 rounded bg-white/80 border text-red-600">Eliminar</button>
                </div>
              </td>
            </tr>
            <tr v-if="categories.length===0">
              <td colspan="3" class="p-4 text-center text-gray-500">No hay categorías.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Modal: teleport AL CUERPO. IMPORTANTE: también tiene v-cloak para ocultarlo antes del montaje -->
      <teleport to="body">
        <transition name="modal">
          <div v-cloak v-if="showCategoryModal" class="fixed inset-0 z-50 flex items-center justify-center">
            <div class="absolute inset-0 bg-black/40" @click="closeCategoryModal"></div>
            <div class="relative bg-white rounded-2xl p-6 shadow-2xl w-full max-w-md">
              <h3 class="text-xl font-bold mb-4">[[ editingCategory ? 'Editar categoría' : 'Nueva categoría' ]]</h3>
              <form @submit.prevent="saveCategory" class="space-y-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700">Nombre *</label>
                  <input id="cat-name" v-model="categoryForm.nombre" required class="w-full p-2 border rounded" placeholder="Ej. Bebidas">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700">Descripción</label>
                  <textarea v-model="categoryForm.descripcion" class="w-full p-2 border rounded" rows="3"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                  <button type="button" @click="closeCategoryModal" class="px-4 py-2 rounded bg-gray-200">Cancelar</button>
                  <button type="submit" class="px-4 py-2 rounded bg-brandOrange text-white">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </transition>
      </teleport>
    </main>
  </div>
</body>
</html>
